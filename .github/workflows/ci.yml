name: 점검과 배포

# 순서: 코드 검사 → 에뮬레이터 시험 → 미리보기 채널 배포 → 미리보기 주소에서 진짜 Firebase(시험용 프로젝트)로 시험 → 실제 배포 → 실제 주소 확인
# 앞 단계가 하나라도 실패하면 뒤 단계(특히 실제 배포)는 돌지 않는다.
# 빌드는 '코드 검사'에서 한 번만 하고, 그 파일 그대로 미리보기와 실제 서비스에 올린다 (시험한 파일 = 올리는 파일).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 매일 새벽(한국 03:17): 축제·여행경보·입국요건·환율을 새로 받아 같은 관문을 거쳐 다시 배포
  schedule:
    - cron: '17 18 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# 파이프(| tee)를 써도 앞 명령이 실패하면 단계가 실패하도록 (bash -eo pipefail)
defaults:
  run:
    shell: bash

jobs:
  # 0. 물어보기 뒷단(Cloudflare Worker, 무료) — 비밀값이 있을 때만. 주소는 빌드에 넣는다. 없으면 앱은 규칙형 답만 한다.
  worker:
    name: 0. 물어보기 뒷단 (Cloudflare Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 비밀값 확인
        id: has
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Cloudflare 비밀값이 없어 뒷단은 건너뜁니다 (규칙형 답만)"; fi
      - name: 타입 검사와 배포 (실패해도 앱 배포는 계속 — 그때는 규칙형만)
        id: deploy
        if: steps.has.outputs.ok == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set -x
          npm ci 2>&1 | tail -3
          npx tsc --noEmit
          npx wrangler whoami 2>&1 | tee -a worker-output.txt
          # 하루 횟수용 KV 저장소: 없으면 만들고, id를 설정에 넣는다
          npx wrangler kv namespace list > kv-list.json 2>kv-list.err || true
          cat kv-list.err | tee -a worker-output.txt
          ID=$(node -e "const s=require('fs').readFileSync('kv-list.json','utf8');const i=s.indexOf('[');if(i<0){console.log('');process.exit()}const l=JSON.parse(s.slice(i));const x=l.find(n=>n.title==='QUOTA'||n.title==='borapin-ask-QUOTA');console.log(x?x.id:'')")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create QUOTA 2>&1 | tee kv-create.txt | tee -a worker-output.txt
            ID=$(grep -o '[0-9a-f]\{32\}' kv-create.txt | head -1)
          fi
          echo "KV id: $ID" | tee -a worker-output.txt
          test -n "$ID"
          sed -i "s/REPLACED_BY_CI/$ID/" wrangler.toml
          npx wrangler deploy 2>&1 | tee deploy-output.txt | tee -a worker-output.txt
          # 관광공사 키(지금 여기 근처 관광지): 값은 표준입력으로만 넘겨 기록에 남지 않게
          set +x
          if [ -n "$DATA_GO_KR_KEY" ]; then printf '%s' "$DATA_GO_KR_KEY" | npx wrangler secret put DATA_GO_KR_KEY >/dev/null 2>&1 && echo "관광공사 키: 넣음" | tee -a worker-output.txt || echo "관광공사 키: 넣기 실패" | tee -a worker-output.txt; fi
          set -x
          URL=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy-output.txt | head -1)
          test -n "$URL"
          curl -sf "$URL/health" | tee -a worker-output.txt
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: 결과 올리기
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh worker worker/worker-output.txt worker/kv-list.err

  check:
    name: 1. 코드 검사와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사 (앱 + 스크립트 + 시험 코드)
        run: npm run typecheck
      - name: 순수 기능 시험 (날짜·계절·조사 등)
        run: npm run test:unit 2>&1 | tee unit-output.txt
      - name: 여행정보 DB 검사
        run: npx tsx scripts/travelinfo.ts --check
      - name: 찾아보기 채점 (95% 미만이면 멈춤)
        run: npx tsx scripts/ask-test.ts 2>&1 | tee ask-output.txt
      - name: 지역 축제 자료 받기 (한국관광공사 TourAPI, 실패하면 기존 자료 그대로)
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: npx tsx scripts/tour-festivals.ts 2>&1 | tee festivals-output.txt
      - name: 관광공사 자료 받기 (시·군 관광지·무장애 · 실패하면 지난 자료)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        # 공공데이터 서버가 느린 날은 6분에서 끊고 지난 자료를 쓴다 (빌드 전체가 시간 초과로 취소되지 않게)
        run: timeout 360 npx tsx scripts/tour-build.ts 2>&1 | tee tour-output.txt || echo '관광공사 자료 받기 시간 초과 → 지난 자료 유지'
      - name: 관광빅데이터 받기 (요즘 뜨는 곳·한적한 곳·연관 관광지·붐빔 · 실패하면 지난 자료)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SAMPLE: '1'
        run: timeout 360 npx tsx scripts/tour-trend.ts 2>&1 | tee trend-output.txt || echo '관광빅데이터 받기 시간 초과 → 지난 자료 유지'
      - name: 해외 자료 받기 (외교부 여행경보·입국허가요건, 환율 · 실패하면 지난 자료)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
        run: timeout 240 npx tsx scripts/abroad-build.ts 2>&1 | tee abroad-output.txt || echo '해외 자료 받기 시간 초과 → 지난 자료 유지'
      - name: 빌드 (이 파일을 끝까지 그대로 쓴다)
        env:
          VITE_ASK_URL: ${{ needs.worker.outputs.url }}
        run: |
          echo "물어보기 뒷단 주소: ${VITE_ASK_URL:-없음(규칙형만)}"
          npm run build 2>&1 | tee build-output.txt
      - name: 빌드 버전 확인
        run: |
          test "$(node -p "require('./dist/version.json').commit")" = "${GITHUB_SHA::7}"
          grep -q "borapin-version\" content=\"[^\"]*+${GITHUB_SHA::7}\"" dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
      - name: 결과 올리기
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh check unit-output.txt ask-output.txt build-output.txt festivals-output.txt trend-output.txt

  emulator:
    name: 2. 에뮬레이터 시험 (보안 규칙 + 화면)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # chromium(안드로이드 크롬 흉내) + webkit(아이폰 사파리 흉내, @webkit 핵심 시험만 — playwright.config.ts)
      - run: npx playwright install --with-deps chromium webkit
      - name: 보안 규칙 시험 (허용·막힘, 실제 firestore.rules)
        run: npm run test:rules 2>&1 | tee rules-output.txt
      - name: 예전 기록 옮기기 스크립트 점검 (두 번 돌려도 겹치지 않는지)
        run: npm run test:migrate 2>&1 | tee migrate-test-output.txt
      - name: 화면 시험 (구글 창 로그인, 한글 입력, 끌어다 놓기, 375px, 새로 고침 포함 · 아이폰 사파리는 핵심 시험만)
        run: npm run test:e2e 2>&1 | tee test-output.txt
      - name: 크롬 화면 사진 옮겨 두기 (아이폰 시험이 test-results를 지우므로)
        if: always()
        run: mkdir -p shots && cp -r test-results/screens test-results/tour shots/ 2>/dev/null || true
      - name: 크롬 실패 화면 먼저 모으기 (아이폰 시험이 test-results를 지우므로)
        if: failure()
        run: |
          mkdir -p failures
          find test-results \( -name 'test-failed-*.png' -o -name 'error-context.md' -o -name 'trace.zip' \) | while read -r f; do
            cp "$f" "failures/$(echo "$f" | tr '/' '_')"
          done
      - name: 아이폰 사파리(WebKit) 핵심 시험 (아직 참고용 — 떨어져도 배포는 막지 않음)
        if: always()
        continue-on-error: true
        run: npm run test:e2e:webkit 2>&1 | tee test-webkit-output.txt
      - name: "실패 화면 모으기 (폴더 이름에 브라우저가 붙는다 …-chromium / …-webkit)"
        if: failure()
        run: |
          mkdir -p failures
          find test-results \( -name 'test-failed-*.png' -o -name 'error-context.md' -o -name 'trace.zip' \) | while read -r f; do
            cp "$f" "failures/$(echo "$f" | tr '/' '_')"
          done
      - name: 결과 올리기 (ci-report 브랜치)
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh test shots/screens shots/tour test-output.txt test-webkit-output.txt rules-output.txt migrate-test-output.txt failures

  preview:
    name: 3. 미리보기 배포와 진짜 Firebase 시험
    needs: [worker, check, emulator]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 시험용 프로젝트는 하나뿐이라 한 번에 하나씩
    concurrency:
      group: borapin-test-project
      cancel-in-progress: false
    outputs:
      url: ${{ steps.channel.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: 배포 열쇠 준비 (실제 프로젝트, 호스팅 미리보기용)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어요"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 미리보기 채널에 배포
        id: channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          ch="ci-$(echo "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-' '-' | cut -c1-30 | sed 's/-*$//')"
          npx firebase hosting:channel:deploy "$ch" --project borapin --expires 3d --non-interactive --json > channel.json
          url=$(node -p "Object.values(require('./channel.json').result)[0].url")
          echo "미리보기 주소: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 미리보기 주소 파일·버전 확인
        run: npx tsx scripts/verify-deploy.ts "${{ steps.channel.outputs.url }}" "${GITHUB_SHA::7}" 2>&1 | tee preview-verify.txt
      - name: 시험용 프로젝트 열쇠 준비
        id: testkey
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEST }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_TEST 비밀값이 없어 진짜 Firebase 시험을 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa-test.json"
          pw="$(openssl rand -base64 24)"
          echo "::add-mask::$pw"
          echo "PREVIEW_PW=$pw" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: 시험용 프로젝트에 보안 규칙 올리기
        if: steps.testkey.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-test.json
          GCLOUD_PROJECT: borapin-test
        run: npx tsx scripts/preview-env.ts rules 2>&1 | tee preview-setup.txt
      - name: 시험 계정 준비
        if: steps.testkey.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-test.json
          GCLOUD_PROJECT: borapin-test
        run: (npx tsx scripts/preview-env.ts cleanup && npx tsx scripts/preview-env.ts seed) 2>&1 | tee -a preview-setup.txt
      - name: 미리보기 주소에서 화면 시험 (진짜 Firebase)
        if: steps.testkey.outputs.ok == 'true'
        env:
          PREVIEW_URL: ${{ steps.channel.outputs.url }}
        run: |
          npx playwright install --with-deps chromium
          COMMIT="${GITHUB_SHA::7}" npx playwright test -c playwright.preview.config.ts 2>&1 | tee preview-output.txt
      - name: 보라(AI) 답 품질 점검 (main에 올릴 때만 · 무료 한도 아끼기 · 실패해도 앱 배포는 막지 않고 기록만)
        if: always() && steps.testkey.outputs.ok == 'true' && needs.worker.outputs.url != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          ASK_URL: ${{ needs.worker.outputs.url }}
          FIREBASE_API_KEY: AIzaSyAXT9E3jX2BBJwQv0dWS4Fqcx-7qK8bWt0
          EMAIL: bora.preview@example.com
        run: PW="$PREVIEW_PW" npx tsx scripts/ask-eval.ts 2>&1 | tee ask-eval.txt
      - name: 모델 비교 (커밋 메시지에 [모델비교]가 있을 때만 · 같은 질문을 후보 모델에)
        if: always() && steps.testkey.outputs.ok == 'true' && needs.worker.outputs.url != '' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[모델비교]')
        continue-on-error: true
        env:
          ASK_URL: ${{ needs.worker.outputs.url }}
          FIREBASE_API_KEY: AIzaSyAXT9E3jX2BBJwQv0dWS4Fqcx-7qK8bWt0
          EMAIL: bora.preview@example.com
        run: |
          for m in "@cf/mistralai/mistral-small-3.1-24b-instruct" "@cf/openai/gpt-oss-120b"; do
            sleep 65
            echo "===== $m =====" | tee -a ask-eval.txt
            EVAL_MODEL="$m" PW="$PREVIEW_PW" timeout 600 npx tsx scripts/ask-eval.ts 2>&1 | tee -a ask-eval.txt || true
          done
      - name: 시험 기록·계정 지우기
        if: always() && steps.testkey.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-test.json
          GCLOUD_PROJECT: borapin-test
        run: npx tsx scripts/preview-env.ts cleanup 2>&1 | tee -a preview-setup.txt
      - name: 열쇠 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/sa-test.json"
      - name: 결과 올리기
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh preview preview-verify.txt preview-setup.txt preview-output.txt ask-eval.txt test-results

  deploy:
    name: 4. borapin.web.app 배포와 확인
    needs: preview
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: 배포 열쇠 준비
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어요"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: 배포 전 실제 주소를 열어 옛 버전을 저장해 두기 (옛 버전이 남는지 보려고)
        run: npx tsx scripts/sw-update-check.ts before https://borapin.web.app 2>&1 | tee sw-output.txt || echo "배포 전 기록 실패 (첫 배포일 수 있음)"
      - name: 배포 (미리보기에서 시험한 같은 파일 + 보안 규칙)
        run: npx firebase deploy --only hosting,firestore:rules --project borapin --non-interactive --force --message "${GITHUB_SHA::7}" 2>&1 | tee deploy-output.txt
      - name: 열쇠 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: 실제 주소 파일·버전 확인
        run: npx tsx scripts/verify-deploy.ts https://borapin.web.app "${GITHUB_SHA::7}" 2>&1 | tee live-verify.txt
      - name: 옛 버전이 새 버전으로 바뀌는지 (서비스 워커)
        if: always()
        run: npx tsx scripts/sw-update-check.ts after https://borapin.web.app "${GITHUB_SHA::7}" 2>&1 | tee -a sw-output.txt
      - name: 실제 주소 화면 확인 (로그인 화면, 구글 창 열림, 지도 파일)
        if: always()
        run: |
          export WORKER_PATH="/assets/$(basename dist/assets/maplibre-gl-worker-*.mjs)"
          COMMIT="${GITHUB_SHA::7}" npx playwright test -c playwright.live.config.ts 2>&1 | tee live-output.txt
      - name: 결과 올리기 (ci-report 브랜치)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh deploy deploy-output.txt live-verify.txt sw-output.txt live-output.txt test-results/screens
