name: 점검과 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 자동 점검 (가짜 Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 타입 검사
        run: npm run typecheck
      - name: 빌드
        run: npm run build
      - name: 화면 점검 (에뮬레이터)
        run: npm run test:e2e
      - name: 점검 화면 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/
          retention-days: 14

  deploy:
    name: borapin.web.app 배포
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 배포 열쇠 준비
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어 배포를 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: 호스팅 사이트 확인
        if: steps.key.outputs.ok == 'true'
        run: |
          if ! npx firebase hosting:sites:get borapin --project borapin --non-interactive >/dev/null 2>&1; then
            echo "호스팅 사이트가 없어 새로 만듭니다."
            npx firebase hosting:sites:create borapin --project borapin --non-interactive
          fi
      - name: 배포 (화면 + 보안 규칙)
        if: steps.key.outputs.ok == 'true'
        run: npx firebase deploy --only hosting,firestore:rules --project borapin --non-interactive --force --message "${GITHUB_SHA::7}"
      - name: 열쇠 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
