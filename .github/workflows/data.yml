name: 데이터 만들기

# data-build 브랜치에 올리면 외부 공개 자료를 받아 계산하고, 결과를 ci-report 브랜치에 올린다.
on:
  push:
    branches: [data-build]

permissions:
  contents: write

# 파이프(| tee)를 써도 앞 명령이 실패하면 단계가 실패하도록 (bash -eo pipefail)
defaults:
  run:
    shell: bash

jobs:
  seasons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 가기 좋은 달 계산 (NASA POWER)
        run: npx tsx scripts/seasons.ts 2>&1 | tee seasons-output.txt
      - name: 결과 올리기
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh data src/data/seasons.json data/climate.json seasons-output.txt

  wear:
    # ci-report에 차례로 올리게 (동시에 올리면 한쪽이 덮인다)
    needs: seasons
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 세계 도시 달별 기후 (옷차림 재료, NASA POWER)
        run: npx tsx scripts/wear.ts 2>&1 | tee wear-output.txt
      - name: 결과 올리기
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-report.sh wear src/data/wear.json wear-output.txt
