<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112" width="96" height="112" role="img" aria-label="핀이">
  <!-- 핀이: 보라핀의 길잡이 친구. 지도에 꽂는 핀에 얼굴을 그린 원작 캐릭터 -->
  <defs>
    <radialGradient id="g" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#8A6CFF"/>
      <stop offset="1" stop-color="#5B3FD1"/>
    </radialGradient>
  </defs>
  <!-- 그림자 -->
  <ellipse cx="48" cy="104" rx="16" ry="4" fill="#1E1640" opacity=".14"/>
  <!-- 핀 몸통 -->
  <path d="M48 100 C34 80 14 64 14 42 a34 34 0 0 1 68 0 c0 22-20 38-34 58z" fill="url(#g)" stroke="#1E1640" stroke-width="3" stroke-linejoin="round"/>
  <!-- 얼굴 판 -->
  <circle cx="48" cy="42" r="23" fill="#FFF8F0" stroke="#1E1640" stroke-width="3"/>
  <!-- 볼 -->
  <circle cx="35" cy="48" r="4.5" fill="#F7B2C2"/>
  <circle cx="61" cy="48" r="4.5" fill="#F7B2C2"/>
  <!-- 눈 -->
  <circle cx="40" cy="40" r="3.2" fill="#1E1640"/>
  <circle cx="56" cy="40" r="3.2" fill="#1E1640"/>
  <circle cx="41.2" cy="38.8" r="1.1" fill="#fff"/>
  <circle cx="57.2" cy="38.8" r="1.1" fill="#fff"/>
  <!-- 입 -->
  <path d="M42 49 q6 6 12 0" fill="none" stroke="#1E1640" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 반짝 -->
  <path d="M20 14 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8z" fill="#FFF2BF" stroke="#1E1640" stroke-width="2" stroke-linejoin="round"/>
  <path d="M63 16 q7 1 9 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".65"/>
</svg>
